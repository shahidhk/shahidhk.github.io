---
layout: default
title: "Search"
---

<div class="profile-section">
  <div class="section-bar">
    <h2>search</h2>
  </div>
  <div id="search-container">
    <input type="text" id="search-input" placeholder="type here...">
    <ul id="results-container"><small>start typing to see results</small></ul>
  </div>
</div>

<script src="{{ site.baseurl }}/js/jekyll-search.js" type="text/javascript"></script>

<script type="text/javascript">
  SimpleJekyllSearch.init({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    dataSource: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}<\/a><small>{date}<\/small><\/li>',
    noResultsText: 'No results found',
    limit: 10,
    fuzzy: true,
  })
</script>
