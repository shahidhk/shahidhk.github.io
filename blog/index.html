---
layout: default
title: "Blog"
---

<div class="profile-section">
  <div class="section-bar">
    <h2>posts</h2>
    <span class="section-context">
      <a href="{{ site.baseurl }}/posts/">by year</a> ·
      <a href="{{ site.baseurl }}/posts-by-categories/">by category</a> ·
      <a href="{{ site.baseurl }}/search/">search</a> ·
      <a href="{{ site.baseurl }}/feed.xml">feed</a>
    </span>
  </div>

  {% for post in site.posts %}
  <div class="entry">
    <span class="entry-date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <div class="entry-copy">
      <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h3>
      {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
    </div>
  </div>
  {% endfor %}
</div>
